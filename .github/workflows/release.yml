name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore toolchain
        run: ./scripts/fetch-tools.sh

      - name: Build APK
        run: ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-phone-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls dist/*.apk | head -1)
          NAME=$(basename "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            echo "Release $TAG already exists — asset updated."
            exit 0
          fi
          gh release create "$TAG" "$APK" \
            --title "Aurora Phone $TAG" \
            --verify-tag \
            --notes "$(cat <<NOTES
          **Aurora Phone $TAG** — premium dialer & caller ID for Android.

          ### Highlights
          - Modern light/dark UI with gradient design and adaptive icon
          - Detailed caller info: location, carrier, number type, offline risk analysis, per-number history
          - Recents grouped with badges, T9 dialpad with live number intel
          - Full-screen incoming caller ID with call timer (simulator)
          - Favorites, fast-scroll contacts, search, block list, spam filtering
          - 100% offline number intelligence (200+ country codes, BD operators, area-code regions)

          ### Install
          Download \`$NAME\`, then run:

          \`\`\`
          adb install $NAME
          \`\`\`

          Or copy the APK to your phone and open it (allow unknown sources).

          - **Package:** com.aurora.phone
          - **Requires:** Android 8.0+ (API 26)
          - **SHA-256:** \`$SHA\`
          - **Signed:** APK Signature Scheme v2 + v3
          NOTES
          )"
