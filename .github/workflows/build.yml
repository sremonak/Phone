name: Build APK (CI)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore toolchain
        run: ./scripts/fetch-tools.sh

      - name: Build APK
        run: ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-phone-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
